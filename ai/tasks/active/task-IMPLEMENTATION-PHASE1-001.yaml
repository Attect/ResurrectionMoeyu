risk_register:
  - id: "RISK-PHASE1-001"
    title: "SHA-256 向后兼容性风险"
    category: "技术风险"
    severity: "中"
    probability: "高"
    impact: "中"
    description: |
      SHA-256 升级需要保持与现有 API 签名的向后兼容，服务器端可能仍使用 SHA-1
    mitigation_strategy: |
      - 实现双签名支持 (SHA-1 + SHA-256)
      - 配置化切换机制
      - 完整的兼容性测试套件
    owner: "code-builder"
    status: "open"
    
  - id: "RISK-PHASE1-002"
    title: "OkHttp/Retrofit 学习曲线"
    category: "技术风险"
    severity: "低"
    probability: "中"
    impact: "低"
    description: |
      团队对 OkHttp/Retrofit 的熟悉程度可能影响实施速度
    mitigation_strategy: |
      - 前期技术预研和原型验证
      - 参考最佳实践文档
      - 渐进式迁移策略
    owner: "code-builder"
    status: "open"
    
  - id: "RISK-PHASE1-003"
    title: "Coroutines 迁移复杂度"
    category: "技术风险"
    severity: "高"
    probability: "中"
    impact: "高"
    description: |
      AsyncTask 向 Coroutines 迁移涉及核心业务逻辑，复杂度较高
    mitigation_strategy: |
      - 分阶段迁移 (先 API 层，再业务层)
      - 保持双框架并行运行期
      - 完善的测试覆盖和验证机制
    owner: "code-builder"
    status: "open"

